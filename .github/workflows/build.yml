name: Build Aknan Download for Windows

# Every push: build and keep the result as an artifact.
# A push to main whose commit message contains [release] also publishes a
# GitHub release v<version> with the setup and version.json; installed
# copies of the program read version.json of the latest release
# (Help > Check for updates, or by themselves when they start).

on:
  push:
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Aknan Download's own small ffmpeg (tools/ffmpeg/build.sh): built from the
  # official sources, both checked (exact commit / SHA-256), kept in the cache
  # until the script or a version changes
  ffmpeg:
    runs-on: ubuntu-24.04
    env:
      FFMPEG_TAG: n8.0.3
      FFMPEG_COMMIT: 8ae0b34901ba60a802f183ee75a250a9fc3e09a5
      LAME_URL: https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
      LAME_SHA256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
      # the exact cut of "Download a part of a video" makes the picture again with it
      OPENH264_TAG: v2.6.0
      OPENH264_COMMIT: 652bdb7719f30b52b08e506645a7322ff1b2cc6f
      DAV1D_URL: https://code.videolan.org/videolan/dav1d/-/archive/1.5.1/dav1d-1.5.1.tar.gz
      DAV1D_SHA256: fa635e2bdb25147b1384007c83e15de44c589582bb3b9a53fc1579cb9d74b695
      FT_URL: https://downloads.sourceforge.net/project/freetype/freetype2/2.13.3/freetype-2.13.3.tar.xz
      FT_SHA256: 0550350666d427c74daeb85d5ac7bb353acba5f76956395995311a9c6f063289
      FRIBIDI_URL: https://github.com/fribidi/fribidi/releases/download/v1.0.16/fribidi-1.0.16.tar.xz
      FRIBIDI_SHA256: 1b1cde5b235d40479e91be2f0e88a309e3214c8ab470ec8a2744d82a5a9ea05c
      HB_URL: https://github.com/harfbuzz/harfbuzz/releases/download/10.2.0/harfbuzz-10.2.0.tar.xz
      HB_SHA256: 620e3468faec2ea8685d32c46a58469b850ef63040b3565cde05959825b48227
      ASS_URL: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
      ASS_SHA256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ env.FFMPEG_COMMIT }}-${{ env.LAME_SHA256 }}-${{ env.OPENH264_COMMIT }}-${{ env.DAV1D_SHA256 }}-${{ env.ASS_SHA256 }}-${{ hashFiles('tools/ffmpeg/build.sh') }}
      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mingw-w64 nasm pkg-config make cmake meson ninja-build xz-utils
          git clone -q --depth 1 --branch "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg ffmpeg-src
          test "$(git -C ffmpeg-src rev-parse HEAD)" = "$FFMPEG_COMMIT"
          git clone -q --depth 1 --branch "$OPENH264_TAG" https://github.com/cisco/openh264 openh264-src
          test "$(git -C openh264-src rev-parse HEAD)" = "$OPENH264_COMMIT"
          fetch_tar() { curl -sSfL -o "$1" "$2"; echo "$3  $1" | sha256sum -c -; mkdir -p "$4"; tar -xf "$1" --strip-components=1 -C "$4"; }
          fetch_tar lame.tar.gz "$LAME_URL" "$LAME_SHA256" lame-src
          fetch_tar dav1d.tar.gz "$DAV1D_URL" "$DAV1D_SHA256" dav1d-src
          fetch_tar ft.tar.xz "$FT_URL" "$FT_SHA256" ft-src
          fetch_tar fribidi.tar.xz "$FRIBIDI_URL" "$FRIBIDI_SHA256" fribidi-src
          fetch_tar hb.tar.xz "$HB_URL" "$HB_SHA256" hb-src
          fetch_tar ass.tar.xz "$ASS_URL" "$ASS_SHA256" ass-src
          CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix bash tools/ffmpeg/build.sh ffmpeg-src lame-src openh264-src dav1d-src ft-src fribidi-src hb-src ass-src ffmpeg-out
          echo "$FFMPEG_TAG ($FFMPEG_COMMIT), LAME 3.100, OpenH264 $OPENH264_TAG, dav1d 1.5.1, FreeType 2.13.3, FriBidi 1.0.16, HarfBuzz 10.2.0, libass 0.17.3" > ffmpeg-out/ffmpeg-version.txt
      - name: Test files for our ffmpeg (made with the system's full ffmpeg)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg >/dev/null
          mkdir -p ffmpeg-test && cd ffmpeg-test
          F="ffmpeg -hide_banner -loglevel error -y"
          V="-f lavfi -i testsrc2=size=320x180:rate=25:duration=4"; A="-f lavfi -i sine=frequency=500:duration=4:sample_rate=48000"
          $F $V -c:v libx264 -an -movflags +frag_keyframe+empty_moov -f mp4 v.mp4
          $F $A -c:a aac -vn -movflags +frag_keyframe+empty_moov -f mp4 a.m4a
          $F $V -c:v libvpx-vp9 -deadline realtime -an -f webm v.webm
          $F $A -c:a libopus -vn -f webm a.webm
          $F $V $A -c:v libx264 -c:a aac -f mpegts s.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg
          path: ffmpeg-out
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-test
          path: ffmpeg-test
          retention-days: 3

  windows:
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      # actions pinned to exact commits (a moved tag can't change the build)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg
          path: ffmpeg-out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-test
          path: ffmpeg-test
      - name: Check our ffmpeg (everything Aknan Download asks of it)
        shell: pwsh
        run: |
          $ff = "ffmpeg-out/ffmpeg.exe"; $t = "ffmpeg-test"
          function Run([string[]]$a, $out) {
            & $ff -hide_banner -loglevel error -y @a $out
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out) -or (Get-Item $out).Length -lt 1000) { throw "our ffmpeg failed: $($a -join ' ') $out" }
          }
          Run @("-i", "$t/v.mp4", "-i", "$t/a.m4a", "-map", "0:v:0", "-map", "1:a:0", "-c", "copy", "-movflags", "+faststart", "-f", "mp4") "$t/o1.mp4"
          Run @("-i", "$t/v.webm", "-i", "$t/a.webm", "-map", "0:v:0", "-map", "1:a:0", "-c", "copy", "-f", "webm") "$t/o2.webm"
          Run @("-i", "$t/a.webm", "-vn", "-map", "0:a:0", "-c:a", "libmp3lame", "-b:a", "192k", "-f", "mp3") "$t/o3.mp3"
          Run @("-f", "mpegts", "-i", "$t/s.ts", "-map", "0:v?", "-map", "0:a?", "-c", "copy", "-movflags", "+faststart", "-f", "mp4") "$t/o4.mp4"
          $n = (Get-Item "$t/v.mp4").Length / 2
          Run @("-protocol_whitelist", "file,subfile", "-i", "subfile,,start,0,end,$n,,:$((Resolve-Path "$t/v.mp4").Path)", "-c", "copy", "-f", "matroska") "$t/o5.mkv"
          # "Download a part": the quick cut, the exact cut (the picture made
          # again with OpenH264), and reading over plain http on this computer
          Run @("-ss", "1.2", "-i", "$t/s.ts", "-t", "1.5", "-map", "0:v:0?", "-map", "0:a:0?", "-c", "copy", "-avoid_negative_ts", "make_zero", "-movflags", "+faststart", "-f", "mp4") "$t/o6.mp4"
          Run @("-ss", "1.2", "-i", "$t/s.ts", "-t", "1.5", "-map", "0:v:0?", "-map", "0:a:0?", "-c:v", "libopenh264", "-b:v", "2000k", "-vf", "format=yuv420p", "-c:a", "aac", "-b:a", "192k", "-movflags", "+faststart", "-f", "mp4") "$t/o7.mp4"
          Run @("-ss", "1", "-i", "$t/v.webm", "-t", "1", "-c:v", "libopenh264", "-b:v", "1000k", "-vf", "format=yuv420p", "-an", "-f", "mp4") "$t/o8.mp4"
          [IO.File]::WriteAllText("$PWD/$t/sub.srt", "1`n00:00:00,000 --> 00:00:02,000`nمرحبا`n`n", [Text.UTF8Encoding]::new($false))
          Run @("-i", "$t/v.mp4", "-vf", "scale=trunc(iw/2)*2:trunc(ih/2)*2,subtitles=$t/sub.srt", "-c:v", "libopenh264", "-b:v", "1200k", "-pix_fmt", "yuv420p", "-an", "-f", "mp4") "$t/o9.mp4"
          if (-not ((& $ff -hide_banner -filters 2>&1) -match "subtitles")) { throw "missing subtitles filter" }
          if (-not ((& $ff -hide_banner -decoders 2>&1) -match "libdav1d")) { throw "missing libdav1d decoder" }
          if (-not ((& $ff -hide_banner -protocols 2>&1) -match "http")) { throw "our ffmpeg can't read http" }
          Write-Host "our ffmpeg: $((Get-Item $ff).Length / 1MB) MB, all checks passed"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run extension tests
        run: |
          node extension/test/bundle.test.js
          node extension/test/wave2-ext.test.js
          node extension/test/yt-core.test.js
          node extension/test/background.sim.js
          node extension/test/helper.sim.js
          node extension/test/servers.sim.js
          node extension/test/subtitles.sim.js
      - name: Run engine tests
        shell: pwsh
        run: |
          cargo test -p swiftget-engine --no-fail-fast 2>&1 | Tee-Object -FilePath tests.txt
          $code = $LASTEXITCODE
          # failures (only real ones) show up as annotations on the run page;
          # case-sensitive, or every "0 failed" summary line looked like one
          if ($code -ne 0) {
            Select-String -CaseSensitive -Path tests.txt -Pattern "^error(\[|:)|panicked at|^test .* FAILED$|^---- " |
              Select-Object -First 40 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            throw "engine tests failed (exit $code)"
          }
      - name: Check dependencies for known vulnerabilities
        shell: pwsh
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          # fails on published vulnerabilities; "unmaintained" notices only warn
          cargo audit
      - name: Build release
        shell: pwsh
        run: |
          # the program can fetch this very ffmpeg.exe again when it goes
          # missing (an antivirus...), and uses it only with this SHA-256
          $env:AKNAN_FFMPEG_SHA256 = (Get-FileHash ffmpeg-out/ffmpeg.exe -Algorithm SHA256).Hash.ToLower()
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
      - name: Package
        shell: pwsh
        env:
          # Mozilla add-on keys (addons.mozilla.org > Developer Hub > API keys);
          # with them the Firefox add-on is signed and stays in Firefox for good
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          # Ed25519 key that signs version.json; the program installs only
          # updates signed with it (selfupdate.rs has the public half)
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          IS_RELEASE: ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]') }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: ./installer/ci-package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AknanDownload-windows
          path: AknanDownload-windows.zip
      # a release is published only when the commit message says [release]
      # (tag v<version> is created here); the same version again is skipped
      - name: Publish release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "v$env:VERSION is already released"; exit 0 }
          Copy-Item ffmpeg-out/ffmpeg.exe dist/ffmpeg.exe
          $files = @("dist/AknanDownload-Setup.exe", "dist/version.json", "dist/SHA256SUMS.txt", "dist/ffmpeg.exe", "dist/AknanDownload-Extension-Chrome.zip", "dist/AknanDownload-Extension-Firefox.zip")
          if (Test-Path dist/aknan-download-firefox.xpi) { $files += "dist/aknan-download-firefox.xpi", "dist/firefox-updates.json" }
          gh release create "v$env:VERSION" @files --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Aknan Download $env:VERSION" --notes "Aknan Download $env:VERSION" --latest
          if ($LASTEXITCODE -ne 0) { throw "could not create the release" }
          # older releases stay as they are (a way back, and their links keep working)
