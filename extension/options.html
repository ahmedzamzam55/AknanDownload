<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aknan Download - Settings</title>
<style>
  body { font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: #1f2733; margin: 0; padding: 18px 22px; min-width: 420px; background: #f4f6fa; }
  h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 18px; }
  h2 img { width: 28px; height: 28px; }
  .card { background: #fff; border-radius: 10px; padding: 12px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  label { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  select { padding: 3px 6px; border: 1px solid #d5dbe4; border-radius: 6px; font: inherit; }
  input[type=number] { width: 90px; padding: 4px 8px; border: 1px solid #d5dbe4; border-radius: 6px; font: inherit; }
  input[type=range] { flex: 1; accent-color: #1f6feb; }
  output { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  [dir="rtl"] output { text-align: left; }
  .saved { color: #1a9e5a; font-size: 12px; height: 16px; margin-top: 8px; }
</style>
</head>
<body>
  <h2><img src="icons/icon48.png" alt=""><span id="heading">Aknan Download — Settings</span></h2>
  <div class="card">
    <label><input type="checkbox" id="intercept"> <span id="lblIntercept">Send browser downloads to Aknan Download</span></label>
    <label><span id="lblMinSize">Ignore files smaller than</span> <input type="number" id="minSize" min="0"> <span id="lblKb">KB</span></label>
    <label><span id="lblPort">App port</span> <input type="number" id="port" min="1024" max="65535"></label>
    <label><span id="lblBubbleSize">Size of the "Download this video" button</span>
      <input type="range" id="bubbleScale" min="50" max="200" step="5" value="100">
      <output id="bubbleScaleText">100%</output>
    </label>
  </div>
  <div class="saved" id="saved"></div>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
